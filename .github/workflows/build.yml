name: Build Jekyll site and PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pandoc, LaTeX and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-lang-greek fonts-dejavu-core
          pip install PyYAML

      - name: Generate Markdown from YAML
        run: python generate_cv.py

      - name: Generate A4 PDF with Pandoc and LaTeX
        run: |
          pandoc cv-generated.md \
            --pdf-engine=xelatex \
            -V lang=el \
            -V mainfont="DejaVu Sans" \
            -V geometry:margin=1.5cm \
            -o cv-generated.pdf

      - name: Prepare published website
        run: |
          mkdir -p public
          cp -a _site/. public/
          cp cv-generated.pdf public/cv.pdf

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
